name: Lab 7 - ChessMaster tests

on:
  push:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/lab7-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run Go tests
        run: go test -count=1 -v ./...
